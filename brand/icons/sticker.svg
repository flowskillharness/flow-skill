<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t-sticker">
  <title id="t-sticker">flow — Die-Cut Sticker</title>
  <!-- Die-cut white Paper backing contour (3mm bleed equivalent) -->
  <g fill="#F8FAFC">
    <!-- Left stanchion die-cut backing -->
    <path d="M 72 72 H 232 V 168 H 168 V 344 H 232 V 440 H 72 Z"/>
    <!-- Right stanchion die-cut backing -->
    <path d="M 280 72 H 440 V 440 H 280 V 344 H 344 V 168 H 280 Z"/>
    <!-- Chevron die-cut backing bridge (exact 45° angles) -->
    <path d="M 200 108 L 348 256 L 200 404 H 152 L 300 256 L 152 108 Z"/>
  </g>
  <!-- Signal Teal Gate Stanchions -->
  <path fill="#1AA3C4" d="M 96 96 H 208 V 144 H 144 V 368 H 208 V 416 H 96 Z"/>
  <path fill="#1AA3C4" d="M 304 96 H 416 V 416 H 304 V 368 H 368 V 144 H 304 Z"/>
  <!-- Gate Green Pass Chevron -->
  <path fill="#22C55E" d="M 224 156 L 324 256 L 224 356 H 176 L 276 256 L 176 156 Z"/>
</svg>
